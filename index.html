<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[Your Name] — Curriculum</title>
<meta name="description" content="Curriculum vitae of [Your Name] — Full-Stack Developer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;700;900&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/base.css" />
</head>
<body>

<div class="progress" id="progress"></div>

<nav class="top">
  <div class="logo"><span class="mark">YN</span>[Your Name]</div>
  <div class="nav-links">
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </div>
  <a class="nav-cta" href="#contact">Hire me</a>
</nav>

<div id="mount-hero"></div>
<div id="mount-about"></div>
<div id="mount-skills"></div>
<div id="mount-projects"></div>
<div id="mount-contact"></div>

<div id="mount-footer"></div>

<script type="module">
  import { render as renderHero } from './components/hero.js';
  import { render as renderAbout } from './components/about.js';
  import { render as renderSkills } from './components/skills.js';
  import { render as renderProjects } from './components/projects.js';
  import { render as renderContact } from './components/contact.js';
  import { render as renderFooter } from './components/footer.js';

  renderHero(document.getElementById('mount-hero'));
  renderAbout(document.getElementById('mount-about'));
  renderSkills(document.getElementById('mount-skills'));
  renderProjects(document.getElementById('mount-projects'));
  renderContact(document.getElementById('mount-contact'));
  renderFooter(document.getElementById('mount-footer'));

  // Scroll progress
  const progress = document.getElementById('progress');
  let progressRaf = null;
  const updateProgress = () => {
    if (progressRaf) return;
    progressRaf = requestAnimationFrame(() => {
      const scrolled = (window.scrollX / (document.body.scrollWidth - window.innerWidth)) * 100;
      progress.style.width = (isNaN(scrolled) ? 0 : scrolled) + '%';
      progressRaf = null;
    });
  };
  window.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();

  // Smooth animated horizontal scroll: one wheel tick = one section
  const sections = () => Array.from(document.querySelectorAll('.hero,.section,.fun-footer'));
  let targetX = 0;
  let currentX = 0;
  let animating = false;
  let lock = false;
  function sectionIndex() {
    const vw = window.innerWidth;
    return Math.round(currentX / vw);
  }
  function animateScroll() {
    const diff = targetX - currentX;
    if (Math.abs(diff) < 1) { currentX = targetX; window.scrollTo(currentX, 0); animating = false; return; }
    currentX += diff * 0.18;
    window.scrollTo(currentX, 0);
    requestAnimationFrame(animateScroll);
  }
  function go(dir) {
    if (lock) return;
    lock = true;
    const secs = sections();
    const idx = Math.max(0, Math.min(secs.length - 1, sectionIndex() + dir));
    targetX = idx * window.innerWidth;
    if (!animating) { animating = true; requestAnimationFrame(animateScroll); }
    setTimeout(() => { lock = false; }, 450);
  }
  window.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      go(e.deltaY > 0 ? 1 : -1);
    }
  }, { passive: false });

  // keyboard
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(1); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
  });

  // touch swipe
  let touchStartX = null;
  window.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
    touchStartX = null;
  }, { passive: true });

  // Reveal on scroll (horizontal)
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.15, rootMargin: '0px -80px 0px 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  setTimeout(() => {
    document.querySelectorAll('.hero .reveal').forEach(el => el.classList.add('in'));
  }, 100);

  // Hero parallax grid
  const heroGrid = document.querySelector('.hero-grid');
  window.addEventListener('scroll', () => {
    const x = window.scrollX;
    if (x < window.innerWidth && heroGrid) {
      heroGrid.style.transform = `translateX(${x * 0.15}px)`;
    }
  }, { passive: true });
</script>
</body>
</html>
