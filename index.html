<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[Your Name] — Curriculum</title>
<meta name="description" content="Curriculum vitae of [Your Name] — Full-Stack Developer." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;700;900&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/base.css" />
</head>
<body>

<div class="progress" id="progress"></div>
<div class="section-dots" id="sectionDots">
  <button class="section-dot active" data-i="0"><span class="tag">Hero</span><span class="dot"></span></button>
  <button class="section-dot" data-i="1"><span class="tag">About</span><span class="dot"></span></button>
  <button class="section-dot" data-i="2"><span class="tag">Skills</span><span class="dot"></span></button>
  <button class="section-dot" data-i="3"><span class="tag">Projects</span><span class="dot"></span></button>
  <button class="section-dot" data-i="4"><span class="tag">Contact</span><span class="dot"></span></button>
</div>

<nav class="top">
  <div class="logo"><span class="mark">YN</span>[Your Name]</div>
  <div class="nav-links">
    <a href="#about">About</a>
    <a href="#skills">Skills</a>
    <a href="#projects">Projects</a>
    <a href="#contact">Contact</a>
  </div>
  <a class="nav-cta" href="#contact">Hire me</a>
</nav>

<div id="mount-hero"></div>
<div id="mount-about"></div>
<div id="mount-skills"></div>
<div id="mount-projects"></div>
<div id="mount-contact"></div>

<script type="module">
  import { render as renderHero } from './components/hero.js';
  import { render as renderAbout } from './components/about.js';
  import { render as renderSkills } from './components/skills.js';
  import { render as renderProjects } from './components/projects.js';
  import { render as renderContact } from './components/contact.js';

  renderHero(document.getElementById('mount-hero'));
  renderAbout(document.getElementById('mount-about'));
  renderSkills(document.getElementById('mount-skills'));
  renderProjects(document.getElementById('mount-projects'));
  renderContact(document.getElementById('mount-contact'));

  // Scroll progress
  const progress = document.getElementById('progress');
  let progressRaf = null;
  const updateProgress = () => {
    if (progressRaf) return;
    progressRaf = requestAnimationFrame(() => {
      const scrolled = (window.scrollX / (document.body.scrollWidth - window.innerWidth)) * 100;
      progress.style.width = (isNaN(scrolled) ? 0 : scrolled) + '%';
      progressRaf = null;
    });
  };
  window.addEventListener('scroll', updateProgress, { passive: true });
  updateProgress();

  // Section dots: active state + click to scroll
  const dots = document.querySelectorAll('.section-dot');
  function updateDots() {
    const idx = Math.round(window.scrollX / window.innerWidth);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    // update --ac on html? dots use var(--ac, accent) from parent; set per active not needed
  }
  window.addEventListener('scroll', updateDots, { passive: true });
  updateDots();
  dots.forEach(d => {
    d.addEventListener('click', () => {
      const i = parseInt(d.dataset.i, 10);
      window.scrollTo({ left: i * window.innerWidth, behavior: 'smooth' });
    });
  });

  // Horizontal scroll: wheel vertical -> horizontal (native smooth + snap)
  window.addEventListener('wheel', (e) => {
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
      e.preventDefault();
      window.scrollBy({ left: e.deltaY, behavior: 'auto' });
    }
  }, { passive: false });

  // keyboard
  window.addEventListener('keydown', (e) => {
    if (e.target.closest('button, a, input, select, textarea, dialog[open]')) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault();
      window.scrollBy({ left: window.innerWidth, behavior: 'smooth' });
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault();
      window.scrollBy({ left: -window.innerWidth, behavior: 'smooth' });
    }
  });

  // touch swipe
  let touchStartX = null;
  window.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 60) window.scrollBy({ left: dx < 0 ? window.innerWidth : -window.innerWidth, behavior: 'smooth' });
    touchStartX = null;
  }, { passive: true });

  // Reveal on scroll (horizontal)
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { threshold: 0.15, rootMargin: '0px -80px 0px 0px' });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  setTimeout(() => {
    document.querySelectorAll('.hero .reveal').forEach(el => el.classList.add('in'));
  }, 100);

  // Hero parallax grid
  const heroGrid = document.querySelector('.hero-grid');
  window.addEventListener('scroll', () => {
    const x = window.scrollX;
    if (x < window.innerWidth && heroGrid) {
      heroGrid.style.transform = `translateX(${x * 0.15}px)`;
    }
  }, { passive: true });
</script>
</body>
</html>
